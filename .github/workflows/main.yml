name: Build and Push Backend Image to Aliyun

on:
  push:
    branches:
      - main
      - develop

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # ------------------- main 分支 -------------------
      - name: Log in to Aliyun Container Registry (ACR - main)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_BJ_REGISTRY }}
          username: ${{ secrets.ALIYUN_BJ_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_BJ_DOCKER_PASSWORD }}

      - name: Build and push Docker image (main branch)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ secrets.ALIYUN_BJ_REGISTRY }}/chat-assist-develop/devcom-backend:latest
            ${{ secrets.ALIYUN_BJ_REGISTRY }}/chat-assist-develop/devcom-backend:${{ env.SHORT_SHA }}

      # ------------------- develop 分支 -------------------
      - name: Log in to Aliyun Container Registry (ACR - develop)
        if: github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_BJ_REGISTRY }}
          username: ${{ secrets.ALIYUN_BJ_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_BJ_DOCKER_PASSWORD }}

      - name: Build and push Docker image (develop branch)
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ secrets.ALIYUN_BJ_REGISTRY }}/chat-assist-develop/devcom-backend-dev:latest
            ${{ secrets.ALIYUN_BJ_REGISTRY }}/chat-assist-develop/devcom-backend-dev:${{ env.SHORT_SHA }}
